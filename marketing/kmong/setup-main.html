<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>크몽 메인 이미지 · 폴더 찾아보기 원격 세팅</title>
<!--
  크몽 세팅 상품(세팅상품_초안.md)의 메인 이미지, 652×488(4:3).
  찍기: node marketing/kmong/render-setup.js
    → 먼저 앱(../../index.html)의 가짜 회사 폴더 화면을 찍어 out/setup-app-shot.png로 두고, 이 페이지에 넣어 out/setup-main.png(2배, 1304×976)로 찍는다.
  모양(2026-11-12, 가르시아 "AI 티 안 나게"): 꾸민 그림 대신 실제 앱 화면을 넣고, 진한 초록 단색 바탕(바탕화면처럼)에 굵은 고딕.
    종이 바탕·명조·CASE 번호·흐린 큰 숫자·형광펜·✓ 세 개 같은 '꾸민 티'는 쓰지 않는다.
  크몽 메인이미지 가이드(2025-01-31)에서 지킬 것:
    - 흰색이 아닌 배경
    - 글자·디자인 요소는 상하좌우 50px 안쪽 (data-safe만 검사. 앱 창은 아래로 잘려 나가게 둔 것이라 예외)
    - 쓰지 않는 말: 무료·N원·할인·가성비·환불 같은 가격 표현, 최고·1위·추천·최초·유일, 연락처·주소(URL)
  글꼴: Pretendard. dist/font-src/에 있는 것(scripts/make-fonts.py가 받음)을 찍을 때만 쓴다.
-->
<style>
  @font-face { font-family: "KM Sans"; src: url("../../dist/font-src/Pretendard-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "KM Sans"; src: url("../../dist/font-src/Pretendard-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "KM Sans"; src: url("../../dist/font-src/Pretendard-ExtraBold.otf"); font-weight: 800; }
  @font-face { font-family: "KM Sans"; src: url("../../dist/font-src/Pretendard-Black.otf"); font-weight: 900; }
  :root { --bg: #17553A; --yellow: #FFD84D; --mint: #D3EADB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "KM Sans", "Pretendard", "Malgun Gothic", sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .img { position: relative; width: 652px; height: 488px; overflow: hidden; background: var(--bg); }
  .img::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 75% at 88% 0%, rgba(255,255,255,.11), rgba(255,255,255,0) 70%); }

  .pill { position: absolute; left: 50px; top: 50px; background: var(--yellow); color: #163D29; font-size: 15px; font-weight: 800;
    line-height: 1; padding: 7px 11px 6px; border-radius: 5px; letter-spacing: -.2px; }
  h1 { position: absolute; left: 50px; top: 86px; margin: 0; color: #fff; font-size: 40px; font-weight: 900; line-height: 1.24;
    letter-spacing: -1.3px; white-space: nowrap; }
  h1 em { font-style: normal; color: var(--yellow); }
  .sub { position: absolute; left: 50px; top: 194px; color: var(--mint); font-size: 19px; font-weight: 700; letter-spacing: -.5px; white-space: nowrap; }

  /* 바탕화면 아이콘(초록 바탕 = 바탕화면) */
  .desk { position: absolute; right: 56px; top: 54px; width: 86px; text-align: center; }
  .desk svg.ic { display: block; margin: 0 auto; }
  .desk span { display: block; margin-top: 5px; color: #fff; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .desk svg.cur { position: absolute; left: 69px; top: 37px; }

  /* 앱 창: 실제 화면을 넣고 아래로 잘려 나가게 */
  .win { position: absolute; left: 50px; right: 50px; top: 236px; height: 300px; background: #F3EEE4; border-radius: 9px 9px 0 0; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 22px 46px rgba(0,0,0,.42); }
  .win .tb { height: 27px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #fff; border-bottom: 1px solid #E2DCCF;
    font-size: 12px; font-weight: 600; color: #3F3F3F; }
  .win .tb i { width: 13px; height: 13px; border-radius: 3px; background: #1D6B3F; display: inline-block; }
  .win .tb .ctl { margin-left: auto; display: flex; gap: 18px; color: #6B6B6B; font-size: 12px; font-weight: 600; }
  .win img { display: block; width: 552px; }
</style>
</head>
<body>
<div class="img">
  <div class="pill" data-safe>회사 PC 원격 세팅</div>
  <h1 data-safe>송장 하나 찾으려고<br>엑셀 <em>한 달 치</em>를 다 여세요?</h1>
  <div class="sub" data-safe>송장번호만 넣으면 그 줄이 바로 나오게 세팅해 드립니다</div>

  <div class="desk" data-safe>
    <svg class="ic" viewBox="0 0 56 56" width="56" height="56" aria-hidden="true">
      <rect x="1" y="1" width="54" height="54" rx="11" fill="#FFFDF8"/>
      <rect x="10" y="10" width="28" height="32" rx="2.5" fill="#1D6B3F"/>
      <path d="M10 19.5h28M10 27h28M10 34.5h28M20 10v32" stroke="#FFFDF8" stroke-width="1.8" opacity=".75"/>
      <circle cx="35" cy="35" r="9" fill="#FFFDF8" stroke="#1D6B3F" stroke-width="3.6"/>
      <path d="M41.5 41.5l6.5 6.5" stroke="#1D6B3F" stroke-width="4.6" stroke-linecap="round"/>
      <rect x="2" y="38" width="16" height="16" rx="2" fill="#fff" stroke="#9A9A9A" stroke-width="1"/>
      <path d="M6 50c0-5 2.5-7.5 7-7.5M10.5 39.8l2.8 2.7-2.8 2.7" fill="none" stroke="#2D5FA8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>엑셀 찾기</span>
    <svg class="cur" viewBox="0 0 16 24" width="17" height="25" aria-hidden="true">
      <path d="M1.5 1.5v18.5l4.8-4.6 3.4 7.2 3.1-1.5-3.3-7h6.6z" fill="#fff" stroke="#1B1B1B" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="win">
    <div class="tb"><i></i>엑셀 모아보기<span class="ctl"><span>—</span><span>☐</span><span>✕</span></span></div>
    <img src="out/setup-app-shot.png" alt="">
  </div>
</div>
</body>
</html>
