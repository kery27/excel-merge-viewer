<!-- 웹 체험 페이지 들어갈 때 비밀번호 화면 — scripts/make-web.sh가 WEB_PW_HASH가 있을 때만 넣는다(__HASH__ 자리에) -->
<style>
  #pwGate { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #pwGate form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  #pwGate h2 { margin: 0; font-size: 17px; }
  #pwGate p { margin: 0; color: var(--sub); font-size: 13px; line-height: 1.6; }
  #pwGate input { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); font: inherit; }
  #pwGateErr { color: var(--warn); min-height: 1.2em; font-size: 13px; }
  body.gated > :not(#pwGate) { visibility: hidden; }
</style>
<div id="pwGate"><form autocomplete="off">
  <h2>엑셀 모아보기 체험</h2>
  <p>받은 비밀번호를 넣어 주세요.</p>
  <input type="password" id="pwGateIn" placeholder="비밀번호" aria-label="비밀번호">
  <div id="pwGateErr"></div>
  <button type="submit">들어가기</button>
</form></div>
<script>
(function () {
  var H = '__HASH__', K = 'emv_web_gate';
  var gate = document.getElementById('pwGate');
  function open() { gate.remove(); document.body.classList.remove('gated'); }
  try { if (sessionStorage.getItem(K) === H) return open(); } catch (e) {}
  document.body.classList.add('gated');
  document.getElementById('pwGateIn').focus();
  gate.querySelector('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var v = document.getElementById('pwGateIn').value;
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('excel-moa:' + v));
    var hex = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    if (hex === H) { try { sessionStorage.setItem(K, H); } catch (e2) {} open(); }
    else document.getElementById('pwGateErr').textContent = '비밀번호가 맞지 않아요.';
  });
})();
</script>
